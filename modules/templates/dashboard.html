<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORATECH - Dashboard de Activaciones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #667eea; 
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle { 
            color: #666; 
            margin-bottom: 30px; 
            font-size: 1.1em;
        }
        
        /* Estadísticas */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number { font-size: 2.5em; font-weight: bold; }
        .stat-label { opacity: 0.9; margin-top: 5px; }
        
        /* Filtros */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .filter-group input, .filter-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* Tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        tr:hover { background: #f5f5f5; }
        
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .badge-success { background: #10b981; color: white; }
        .badge-error { background: #ef4444; color: white; }
        
        .badge-whatsapp { background: #25D366; color: white; }
        .badge-deposito { background: #3b82f6; color: white; }
        .badge-web { background: #8b5cf6; color: white; }
        .badge-manual { background: #6b7280; color: white; }
        .badge-telegram { background: #bd320c; color: white; }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }

        /**LIMPIEZA*/
        .btn-danger {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-danger:hover { opacity: 0.9; }

    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MORATECH Dashboard</h1>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <p class="subtitle" style="margin: 0;">Registro de Activaciones del Sistema</p>
            <button class="btn-danger" onclick="limpiarActivaciones()">🗑️ Limpiar Historial</button>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div class="filters">
            <div class="filter-group">
                <label>Origen</label>
                <select id="filterOrigen" onchange="filtrar()">
                    <option value="">Todos</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="deposito">Depósito</option>
                    <option value="web">Web</option>
                    <option value="manual">Manual</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Buscar Usuario/Token</label>
                <input type="text" id="filterUsuario" placeholder="Nombre o token..." onkeyup="filtrar()">
            </div>
            <div class="filter-group">
                <label>Referencia Bancaria</label>
                <input type="text" id="filterReferencia" placeholder="REF-..." onkeyup="filtrar()">
            </div>
        </div>
        
        <div id="tabla"></div>
    </div>
    
    <script>
        let activaciones = [];
        
        async function cargarDatos() {
            const params = new URLSearchParams({
                origen: document.getElementById('filterOrigen').value,
                usuario: document.getElementById('filterUsuario').value,
                referencia: document.getElementById('filterReferencia').value
            });
            
            const response = await fetch('/api/activaciones?' + params);
            activaciones = await response.json();
            
            // Cargar estadísticas
            const statsResponse = await fetch('/api/estadisticas');
            const stats = await statsResponse.json();
            
            mostrarEstadisticas(stats);
            mostrarTabla();
        }
        
        function mostrarEstadisticas(stats) {
            const html = `
                <div class="stat-card">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">Total Activaciones</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.exitosas}</div>
                    <div class="stat-label">Exitosas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.fallidas}</div>
                    <div class="stat-label">Fallidas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.ultimas_24h}</div>
                    <div class="stat-label">Últimas 24h</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = html;
        } 

        function mostrarTabla() {
            if (activaciones.length === 0) {
                document.getElementById('tabla').innerHTML = '<div class="no-data">📭 No hay activaciones registradas</div>';
                return;
            }
            
            let html = '<table><thead><tr>';
            html += '<th>ID</th><th>Estado</th><th>Fecha/Hora</th><th>Origen</th>';
            html += '<th>Nombre</th><th>Token</th><th>Días</th><th>Referencia</th>';
            html += '</tr></thead><tbody>';
            
            activaciones.forEach(a => {
                const origenBadge = `badge-${a.origen}`;
                const estadoBadge = a.success ? 'badge-success' : 'badge-error';
                const estadoText = a.success ? '✓ Exitoso' : '✗ Fallido';
                
                html += `<tr>
                    <td>${a.id}</td>
                    <td><span class="badge ${estadoBadge}">${estadoText}</span></td>
                    <td>${a.timestamp}</td>
                    <td><span class="badge ${origenBadge}">${a.origen}</span></td>
                    <td>${a.nombre}</td>
                    <td><code>${a.usuario}</code></td>
                    <td>${a.dias}</td>
                    <td>${a.referencia || '-'}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            document.getElementById('tabla').innerHTML = html;
        }

                /**ELIMINAR ACTIVACIONES*/
        async function limpiarActivaciones() {
            // Confirmación 1
            if (!confirm('⚠️ ADVERTENCIA\n\nEsto eliminará TODAS las activaciones del historial.\n\n¿Estás seguro?')) {
                return;
            }
            
            // Confirmación 2 (doble seguridad)
            const confirmText = prompt('Escribe "CONFIRMAR" para eliminar todas las activaciones:');
            if (confirmText !== 'CONFIRMAR') {
                alert('Operación cancelada');
                return;
            }
            
            try {
                const response = await fetch('/api/limpiar-activaciones', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`✅ Éxito\n\n${data.message}`);
                    cargarDatos(); // Recargar dashboard vacío
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (error) {
                alert('❌ Error de conexión: ' + error);
            }
        }
        
        function filtrar() {
            cargarDatos();
        }
        
        // Cargar datos iniciales
        cargarDatos();
        
        // Actualizar cada 30 segundos
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>
